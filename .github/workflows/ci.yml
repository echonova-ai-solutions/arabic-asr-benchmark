name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: README tables match the result files
        run: python scripts/update_readme.py --check
      - name: Synthetic end-to-end example
        run: |
          asr-bench evaluate --references examples/synthetic/references.jsonl \
            --predictions examples/synthetic/predictions_system_a.jsonl --output /tmp/run.json
          asr-bench validate --references examples/synthetic/references.jsonl \
            --predictions examples/synthetic/predictions_system_b.jsonl

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel in a clean environment
        run: |
          pip install build
          python -m build
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/asr-bench normalize "أحمدُ، مدرسة"
